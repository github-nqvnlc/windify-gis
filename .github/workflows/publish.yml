name: Publish Package to NPM

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Chỉ chạy 1 publish tại 1 thời điểm
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

# Đặt permissions ở cấp workflow (top-level) để OIDC hoạt động đúng
permissions:
  contents: read
  id-token: write

jobs:
  verify:
    name: Verify before Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests
        run: npm run test:coverage

      - name: Build Production Package
        run: npm run build

      - name: Run Audits
        run: |
          npm run audit:tree-shaking
          npm run audit:package

      - name: Ensure tag matches package.json version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          echo "Tag version:     $TAG_VERSION"
          echo "package.json:    $PKG_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag ($TAG_VERSION) không khớp version trong package.json ($PKG_VERSION). Hãy chạy npm version trước khi tạo tag."
            exit 1
          fi

  publish:
    name: Publish to NPM Registry
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
          # Không dùng registry-url ở đây để tránh setup-node tạo _authToken trong .npmrc

      - name: Configure NPM registry (no auth token)
        run: echo "registry=https://registry.npmjs.org/" > ~/.npmrc

      - name: Install Dependencies
        run: npm ci

      - name: Build Production Package
        run: npm run build

      - name: Publish to NPM (with Provenance)
        run: npm publish --access public --provenance

name: CI Pipeline

on:
  push:
    branches: [main, 'feat/*', 'fix/*']
  pull_request:
    branches: [main]

jobs:
  lint-test-build:
    name: Lint, Test, Audit & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Code Linting & Formatting Check
        run: |
          npm run lint
          npm run format:check

      - name: Run TypeScript Type Check
        run: npx tsc --noEmit

      - name: Run Vitest Unit Tests & Coverage Audit
        run: npm run test:coverage

      - name: Build Production Bundle
        run: npm run build

      - name: Audit Tree-shaking Engine Separation
        run: npm run audit:tree-shaking

      - name: Audit Package Exports with Publint
        run: npm run audit:package
